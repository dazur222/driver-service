spring.application.name=driver-service
server.port=${SERVER_PORT:18082}
spring.datasource.url=${DRIVER_DB_URL:jdbc:postgresql://localhost:5432/driver_db}
spring.datasource.username=${DRIVER_DB_USER:postgres}
spring.datasource.password=${DRIVER_DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
